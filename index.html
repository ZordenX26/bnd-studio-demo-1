<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BND STUDIO - GORRAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial, sans-serif}
header{padding:15px 30px;border-bottom:1px solid #c9a86a;display:flex;justify-content:space-between}
header b{color:#c9a86a}.section{padding:40px 20px}.section h2{color:#c9a86a;font-size:32px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden}
.card img{width:100%;height:300px;object-fit:cover}.card-info{padding:15px}
.card-info h3{font-size:14px}.price{color:#c9a86a;font-weight:bold;margin:8px 0}
.card button{width:100%;background:transparent;border:1px solid #c9a86a;color:#c9a86a;padding:10px;border-radius:20px;cursor:pointer;font-weight:bold}
.card button:hover{background:#c9a86a;color:#000}
</style>
</head>
<body>
<header><b>BND STUDIO</b><span>GORRAS</span></header>
<div class="section"><h2>GORRAS</h2><div class="grid" id="tienda"></div></div>

<script>
// PRECIOS POR DEFECTO
let productos = [
  { id: 'black', nombre: 'GORRA BND BLACK', precio: 300, foto: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500' },
  { id: 'gold', nombre: 'GORRA BND GOLD', precio: 320, foto: 'https://images.unsplash.com/photo-1534217467420-3e5c0f3d9b5f?w=500' },
  { id: 'snapback', nombre: 'GORRA BND SNAPBACK', precio: 350, foto: 'https://images.unsplash.com/photo-1521369909029-2afed882baee?w=500' }
];

// CARGAR LO QUE GUARDASTE EN EL ADMIN
let guardados = JSON.parse(localStorage.getItem('bnd_gorras'));
if(guardados){
  productos = productos.map(p => {
    let g = guardados.find(x => x.id === p.id);
    return g? {...p, precio: g.precio} : p;
  });
}

function render(){
  document.getElementById('tienda').innerHTML = productos.map(p => `
    <div class="card">
      <img src="${p.foto}">
      <div class="card-info">
        <h3>${p.nombre}</h3>
        <div class="price">$${p.precio} MXN</div>
        <button onclick="window.open('https://wa.me/521000000000?text=Quiero%20${p.nombre}','_blank')">AGREGAR</button>
      </div>
    </div>
  `).join('');
}
render();
</script>
</body>
</html>
