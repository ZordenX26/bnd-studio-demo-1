<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BND STUDIO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial, sans-serif}
header{padding:15px 30px;border-bottom:1px solid #c9a86a;display:flex;justify-content:space-between;position:sticky;top:0;background:#0a0a0a;z-index:10}
header b{color:#c9a86a;letter-spacing:2px}
.hero{padding:80px 20px;text-align:center;border-bottom:1px solid #222}
.hero h1{font-size:48px;color:#c9a86a}.hero p{color:#888;margin-top:10px}
.section{padding:50px 20px;border-bottom:1px solid #1a1a1a}.section h2{color:#c9a86a;font-size:32px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden}
.card img{width:100%;height:320px;object-fit:cover;background:#000}
.card-info{padding:15px}.card-info h3{font-size:14px;letter-spacing:1px}
.price{color:#c9a86a;font-weight:bold;margin:10px 0;font-size:18px}
.card button{width:100%;background:transparent;border:1px solid #c9a86a;color:#c9a86a;padding:11px;border-radius:25px;cursor:pointer;font-weight:bold}
.card button:hover{background:#c9a86a;color:#000}
</style>
</head>
<body>
<header><b>BND STUDIO</b><span>TIENDA OFICIAL</span></header>
<div class="hero"><h1>BND STUDIO</h1><p>Estilo que impone respeto</p></div>

<div class="section"><h2>CORTES</h2><div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=500"><div class="card-info"><h3>CORTE LOW FADE</h3><div class="price">$150 MXN</div><button>RESERVAR</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=500"><div class="card-info"><h3>CORTE MID FADE</h3><div class="price">$150 MXN</div><button>RESERVAR</button></div></div>
</div></div>

<div class="section"><h2>GORRAS</h2><div class="grid" id="gorras"></div></div>

<script>
let base = [
 {id:'black', nombre:'GORRA BND BLACK', precio:300, foto:'./images/gorra1.jpg'},
 {id:'gold', nombre:'GORRA BND GOLD', precio:320, foto:'./images/gorra2.jpg'},
 {id:'snapback', nombre:'GORRA BND SNAPBACK', precio:350, foto:'./images/gorra3.jpg'}
];
let saved = JSON.parse(localStorage.getItem('bnd_gorras'));
if(saved){ base = base.map(b=>{ let s=saved.find(x=>x.id===b.id); return s? {...b, precio:s.precio}: b }) }
document.getElementById('gorras').innerHTML = base.map(p=>`
<div class="card"><img src="${p.foto}" onerror="this.src='https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500'"><div class="card-info"><h3>${p.nombre}</h3><div class="price">$${p.precio} MXN</div><button onclick="window.open('https://wa.me/521000000000?text=Quiero%20${p.nombre}','_blank')">AGREGAR</button></div></div>
`).join('');
</script>
</body>
</html>
