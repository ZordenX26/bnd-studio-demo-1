<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ADMIN BND</title>
<style>body{background:#111;color:#fff;font-family:Arial;padding:20px}input{background:#222;border:1px solid #c9a86a;color:#fff;padding:8px;width:80px;border-radius:5px}button{background:#c9a86a;color:#000;border:none;padding:12px 20px;border-radius:20px;font-weight:bold;cursor:pointer;margin-top:20px;width:100%}table{width:100%;margin-top:20px;border-collapse:collapse}td{padding:12px;border-bottom:1px solid #333}</style>
</head><body>
<h2 style="color:#c9a86a">ADMIN BND - GORRAS</h2>
<table id="tabla"></table>
<button onclick="guardar()">GUARDAR CAMBIOS</button>
<p id="msg" style="color:#0f0;margin-top:10px"></p>
<script>
let productos = [
  { id: 'black', nombre: 'GORRA BND BLACK', precio: 300 },
  { id: 'gold', nombre: 'GORRA BND GOLD', precio: 320 },
  { id: 'snapback', nombre: 'GORRA BND SNAPBACK', precio: 350 }
];
let guardados = JSON.parse(localStorage.getItem('bnd_gorras'));
if(guardados) productos = guardados;

function render(){
 document.getElementById('tabla').innerHTML = productos.map((p,i)=>`
  <tr><td>${p.nombre}</td><td>$ <input type="number" id="p${i}" value="${p.precio}"></td></tr>
 `).join('');
}
function guardar(){
 productos = productos.map((p,i)=>({...p, precio: parseInt(document.getElementById('p'+i).value)}));
 localStorage.setItem('bnd_gorras', JSON.stringify(productos));
 document.getElementById('msg').innerText = '¡Guardado! Ahora recarga tu tienda oficial y verás el cambio de $' + productos[0].precio;
}
render();
</script>
</body></html>
